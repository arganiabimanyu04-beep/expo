
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joki Chat WA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* VERITY */
.verity {
    position: fixed;
    top: 22px;
    left: 22px;
    font-size: 19px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #222;
}


/* CONTENT */
.container {
    text-align: center;
    background: white;
    padding: 45px 35px;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    width: 340px;
}

h1 {
    font-size: 25px;
    margin-bottom: 12px;
}

p {
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

button {
    background: #25D366;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 7px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #1eae55;
    transform: translateY(-2px);
}

.footer {
    margin-top: 25px;
    color: #aaa;
    font-size: 11px;
}
</style>
</head>

<body>

<div class="verity">Arga</div>

<div class="container">
    <h1> Butuh temen mabar have fun?Chat kami aja</h1>
    <p>Klik tombol di bawah untuk menghubungi kami.</p>

    <button onclick="hubungiWA()">
        Chat WhatsApp
    </button>

    <div class="footer">
    © 2026 Arga<br>
    Web by: Arga, Danish, Fabhian
    </div>
</div>

<script>
function hubungiWA() {
    window.open(
        "https://wa.me/6281944421541?text=Halo,%20aku%20mau%20mabar%20have%20fun!",
        "_blank"
    );
}
</script>

</body>
</html>
